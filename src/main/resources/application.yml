server:
  port: 8080

spring:
  application:
    name: polymarket-consensus-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/polybets
    username: polybets
    password: polybets
  jpa:
    hibernate:
      # Semayi Flyway yonetiyor; Hibernate sadece dogrulama yapiyor, otomatik degistirmiyor
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.example.polybets: INFO

polymarket:
  data-api-base-url: https://data-api.polymarket.com
  gamma-api-base-url: https://gamma-api.polymarket.com
  clob-api-base-url: https://clob.polymarket.com
  top-n: 20
  default-category: POLITICS
  time-period: MONTH
  order-by: PNL
  min-common-holders: 3
  positions-limit: 500
  closed-window-days: 3
  sync:
    cron: "0 */30 * * * *"
    enabled: true
  watched-bet:
    check:
      # 15 dakikada bir: fiyat alarmlari icin yeterli hassasiyet, Polymarket
      # API'sini yormuyor (bkz. CLAUDE.md - Fiyat Alarmi Ozelligi).
      cron: "0 */15 * * * *"
      enabled: true

telegram:
  # Bos birakilirsa TelegramNotificationAdapter alarmlari sadece loglar, disari
  # bildirim gondermez. Gercek deger ortam degiskeninden verilmeli, dosyaya yazilmamali.
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}

cors:
  allowed-origins: "http://localhost:5173"
